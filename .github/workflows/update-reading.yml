name: Update reading list

on:
  schedule:
    # 13:00 UTC daily
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the digest email without sending it"
        type: boolean
        default: false
      send_now:
        description: "Send today's digest even if the curation step found nothing new"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Curate today's reading list
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: npm run update:reading

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "reading-list-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/reading.json; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/reading.json
          git commit -m "Update reading list for $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Only mails when there is a fresh issue, or when send_now forces a retry
      # after a failed run. The script no-ops if no issue carries today's date,
      # and skips if that day's broadcast already exists, so reruns are safe.
      - name: Send daily digest email
        if: steps.commit.outputs.changed == 'true' || inputs.dry_run || inputs.send_now
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run send:digest
